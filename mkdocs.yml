site_name: smartmontools
site_url: https://samm-git.github.io/smartmontools-web/
site_description: >-
  Tools to control and monitor storage systems using S.M.A.R.T.
repo_url: https://github.com/smartmontools/smartmontools
repo_name: smartmontools/smartmontools

theme:
  name: material
  variant: modern
  language: en
  logo: assets/smart_logo.gif
  favicon: assets/smart_logo.gif
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy

# Keep the navigation short and task oriented.  Pages that are not listed here
# are still built and linked from the section overview pages.
nav:
  - Home: index.md
  - Download: download.md
  - Documentation:
      - Overview: tocdoc.md
      - FAQ: faq.md
      - Help & support: help.md
      - Bad block HOWTO: badblockhowto.md
      - Reading smartctl reports: howto-readsmartctlreports-ata.md
      - Man pages: man/index.md
  - Device support:
      - Overview: tocsupport.md
      - USB devices: usb.md
      - USB device list: supported-usb-devices.md
      - RAID controllers: supported-raid-controllers.md
      - NVMe: nvme-support.md
  - Development:
      - Overview: tocdeveloper.md
      - Developer guide: developerguide.md
      - History: history.md
      - Team: team.md
  - News: news.md
  - About: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search

extra_css:
  - assets/extra.css

# Remove the "Made with ..." generator line and other third-party branding.
extra:
  generator: false
